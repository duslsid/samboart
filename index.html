<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start : 빌드할 때 scripts/generate-pages.mjs 가 페이지마다 이 구간(제목·설명·og·canonical)을 바꿔 넣는다 -->
    <title>삼보아트 | 인천 앵글·진열대 전문</title>
    <meta name="description" content="인천에서 40여 년 영업해온 앵글·진열대 전문 업체 삼보아트. 곤도라, 렉, 앵글, 찬넬, 제작진열대 견적 문의." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="삼보아트 | 인천 앵글·진열대 전문" />
    <meta property="og:description" content="인천에서 40여 년 영업해온 앵글·진열대 전문 업체 삼보아트. 곤도라, 렉, 앵글, 찬넬, 제작진열대 견적 문의." />
    <meta property="og:url" content="https://samboart.com/" />
    <meta property="og:image" content="https://samboart.com/og/samboart_og_image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- seo:end -->
    <!-- 검색엔진 소유 확인 태그 자리: 네이버 서치어드바이저·구글 서치 콘솔에서 받은 meta 태그를 이 줄 아래에 붙인다 (모든 페이지에 자동 포함) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <!-- GitHub Pages SPA 새로고침 대응: 404.html 이 넘겨준 경로를 원래 주소로 복원 -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
