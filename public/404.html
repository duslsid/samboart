<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>삼보아트 | 인천 앵글·진열대 전문</title>
    <meta name="description" content="인천에서 40여 년 영업해온 앵글·진열대 전문 업체 삼보아트. 곤도라, 렉, 앵글, 찬넬, 제작진열대 견적 문의." />
    <!-- 없는 주소를 공유했을 때 미리보기가 비지 않도록 기본 공유 정보를 넣는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="삼보아트 | 인천 앵글·진열대 전문" />
    <meta property="og:description" content="인천에서 40여 년 영업해온 앵글·진열대 전문 업체 삼보아트. 곤도라, 렉, 앵글, 찬넬, 제작진열대 견적 문의." />
    <meta property="og:url" content="https://samboart.com/" />
    <meta property="og:image" content="https://samboart.com/og/samboart_og_image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- GitHub Pages SPA 우회: 없는 경로로 접속하면 index.html 로 경로를 넘겨 React 라우터가 처리 -->
    <script>
      // 커스텀 도메인(https://samboart.com/) 루트 배포이므로 건너뛸 경로 단계가 없다
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
